[package]
name = "canvas"
version = "1.0.1"
description = "UCLA Canvas client"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "canvas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
lz4_flex = "0.14.1"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"

# Chrome cookie import (Linux only).
[target.'cfg(target_os = "linux")'.dependencies]
rusqlite = { version = "0.42.0", features = ["bundled"] }
aes = "0.9.4"
cbc = "0.2.1"
pbkdf2 = "0.13.0"
sha1 = "0.11.0"
sha2 = "0.11.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
